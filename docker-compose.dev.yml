services:
  web:
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/critic
    environment:
      - DJANGO_SETTINGS_MODULE=critic.settings.development
      - DJANGO_MIGRATE=1
      - DJANGO_COLLECTSTATIC=0
      - DJANGO_SEED=1
  db:
    ports:
      - "5432:5432"
  frontend:
    image: node:24-slim
    working_dir: /frontend
    command: sh -c "npm ci && exec npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://web:8000
      - VITE_OWNER_USERNAME=devuser
    depends_on:
      - web

volumes:
  frontend_node_modules:
