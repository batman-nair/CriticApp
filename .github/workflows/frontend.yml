name: Frontend

on:
  pull_request:
    branches:
      - master
    paths:
      - 'frontend/**'
      - 'openapi/v3.yaml'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check
        env:
          VITE_OWNER_USERNAME: ci-owner

  image:
    name: image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Built and tested only: nothing is pushed.
      - name: Build the image
        run: docker build --build-arg VITE_OWNER_USERNAME=ci-owner -t critic-frontend:ci .

      - name: Start the image
        run: |
          # No --rm: if nginx exits at startup, the logs step still has them.
          docker run -d -p 8080:8080 --name critic-frontend critic-frontend:ci
          curl --retry 10 --retry-all-errors -fsS http://localhost:8080/healthz

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the smoke test
        run: npm run test:e2e

      - name: Show the nginx logs
        if: failure()
        run: docker logs critic-frontend

      - name: Upload the Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
