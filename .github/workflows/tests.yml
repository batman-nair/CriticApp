name: Tests

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major version as k8s/postgres.yaml
        image: postgres:15
        env:
          POSTGRES_USER: critic
          POSTGRES_PASSWORD: critic
          POSTGRES_DB: critic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U critic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: critic.settings.test
      SECRET_KEY: ci-dummy-secret-key-not-for-production
      TEST_DB_ENGINE: postgresql
      TEST_DB_NAME: critic_test
      TEST_DB_USER: critic
      TEST_DB_PASSWORD: critic
      TEST_DB_HOST: localhost
      TEST_DB_PORT: '5432'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system packages for psycopg2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libpq-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -m "not integration"

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Same Dockerfile the deploy builds; also runs collectstatic with
      # production settings. Nothing is pushed.
      - name: Build image
        run: docker build -t criticapp:ci .
