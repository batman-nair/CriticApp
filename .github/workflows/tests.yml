name: Tests

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: critic.settings.test
      # Dummy values only. External APIs are mocked in non-integration tests,
      # but review/views.py builds the API clients at import time and they
      # require these keys to be set.
      SECRET_KEY: ci-dummy-secret-key-not-for-production
      OMDB_API_KEY: ci-dummy
      RAWG_API_KEY: ci-dummy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system packages for psycopg2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libpq-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -m "not integration"

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
