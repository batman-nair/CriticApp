openapi: 3.0.3
info:
  title: CriticApp API v3
  version: '3.0'
  description: 'API for the CriticApp frontend. Successful responses are wrapped as
    {"data": ..., "meta": {...}}; errors are RFC 9457 problem+json with a stable `code`.
    See docs/API_V3.md.'
paths:
  /api/v3/categories:
    get:
      operationId: categories_list
      description: Every category with its filter subcategories, data source and rating
        label.
      summary: List categories
      tags:
      - categories
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
          description: ''
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
  /api/v3/items/{item_id}:
    get:
      operationId: items_retrieve
      description: The stored item, or else the item fetched from its provider (picked
        by the id prefix) and stored. 404 when the prefix is unknown or the provider
        has no such item; 502 when the provider fails.
      summary: Get an item
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
        required: true
      tags:
      - items
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Gateway
  /api/v3/reviews:
    get:
      operationId: reviews_list
      description: Reviews matching the filters. List params can be repeated or separated
        with commas.
      summary: List reviews
      parameters:
      - in: query
        name: category
        schema:
          type: array
          items:
            enum:
            - movie
            - series
            - game
            - anime
            - anime:series
            - anime:movie
            - manga
            - book
            type: string
            description: |-
              * `movie` - movie
              * `series` - series
              * `game` - game
              * `anime` - anime
              * `anime:series` - anime:series
              * `anime:movie` - anime:movie
              * `manga` - manga
              * `book` - book
        description: Only these categories. Repeat the param or separate values with
          commas
      - in: query
        name: exclude_category
        schema:
          type: array
          items:
            enum:
            - movie
            - series
            - game
            - anime
            - anime:series
            - anime:movie
            - manga
            - book
            type: string
            description: |-
              * `movie` - movie
              * `series` - series
              * `game` - game
              * `anime` - anime
              * `anime:series` - anime:series
              * `anime:movie` - anime:movie
              * `manga` - manga
              * `book` - book
        description: Leave out these categories. Repeat the param or separate values
          with commas
      - in: query
        name: language
        schema:
          type: array
          items:
            type: string
            minLength: 1
        description: Only items in these languages. Repeat the param or separate values
          with commas
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size. Default 20; values above 100 are cut down to 100,
          and invalid values fall back to the default.
      - in: query
        name: offset
        schema:
          type: integer
        description: How many reviews to skip.
      - in: query
        name: q
        schema:
          type: string
          default: ''
        description: Search text. Every word has to match
      - in: query
        name: sort
        schema:
          enum:
          - updated
          - -updated
          - title
          - -title
          - rating
          - -rating
          type: string
          default: -updated
          minLength: 1
        description: |-
          * `updated` - updated
          * `-updated` - -updated
          * `title` - title
          * `-title` - -title
          * `rating` - rating
          * `-rating` - -rating
      - in: query
        name: username
        schema:
          type: string
          default: ''
        description: Only this user's reviews
      tags:
      - reviews
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPageResponse'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
    post:
      operationId: reviews_create
      description: Review an item by its id. An item that isn't stored yet is fetched
        from its provider (picked by the id prefix) and stored. 404 when the prefix
        is unknown or the provider has no such item; 502 when the provider fails;
        409 DUPLICATE_REVIEW with `existing_review_id` when the user already reviewed
        the item.
      summary: Create a review
      tags:
      - reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Gateway
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/DuplicateReviewProblem'
          description: Conflict
  /api/v3/reviews/{id}:
    get:
      operationId: reviews_retrieve
      description: |-
        No authentication on safe methods, so a stale token can't turn a public
        read into a 401. `authentication_classes = []` can't be used because the
        same classes take writes.
      summary: Get a review
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - reviews
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
          description: ''
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
    patch:
      operationId: reviews_partial_update
      description: 'Only the fields sent change. The item can''t be changed. `text:
        null` and `tags: []` clear them.'
      summary: Update a review
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedReviewUpdateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
    delete:
      operationId: reviews_destroy
      description: |-
        No authentication on safe methods, so a stale token can't turn a public
        read into a 401. `authentication_classes = []` can't be used because the
        same classes take writes.
      summary: Delete a review
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - reviews
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
  /api/v3/reviews/facets:
    get:
      operationId: reviews_facets
      description: Takes the filters of `GET /api/v3/reviews`. `category` and `exclude_category`
        have no effect on `total` and the category counts, and `language` has no effect
        on the language counts, so a chip shows what you'd get by switching to it.
      summary: Count reviews by category and language
      parameters:
      - in: query
        name: category
        schema:
          type: array
          items:
            enum:
            - movie
            - series
            - game
            - anime
            - anime:series
            - anime:movie
            - manga
            - book
            type: string
            description: |-
              * `movie` - movie
              * `series` - series
              * `game` - game
              * `anime` - anime
              * `anime:series` - anime:series
              * `anime:movie` - anime:movie
              * `manga` - manga
              * `book` - book
        description: Only these categories. Repeat the param or separate values with
          commas
      - in: query
        name: exclude_category
        schema:
          type: array
          items:
            enum:
            - movie
            - series
            - game
            - anime
            - anime:series
            - anime:movie
            - manga
            - book
            type: string
            description: |-
              * `movie` - movie
              * `series` - series
              * `game` - game
              * `anime` - anime
              * `anime:series` - anime:series
              * `anime:movie` - anime:movie
              * `manga` - manga
              * `book` - book
        description: Leave out these categories. Repeat the param or separate values
          with commas
      - in: query
        name: language
        schema:
          type: array
          items:
            type: string
            minLength: 1
        description: Only items in these languages. Repeat the param or separate values
          with commas
      - in: query
        name: q
        schema:
          type: string
          default: ''
        description: Search text. Every word has to match
      - in: query
        name: username
        schema:
          type: string
          default: ''
        description: Only this user's reviews
      tags:
      - reviews
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewFacetsResponse'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
  /api/v3/search:
    get:
      operationId: search_list
      description: Search the category's provider. `genres` and `provider_rating`
        are filled only when the provider returns them with its search. Nothing found
        is an empty list; a failing provider is 502 UPSTREAM_ERROR.
      summary: Search items
      parameters:
      - in: query
        name: category
        schema:
          enum:
          - movie
          - series
          - game
          - anime
          - manga
          - book
          type: string
          minLength: 1
        description: |-
          * `movie` - movie
          * `series` - series
          * `game` - game
          * `anime` - anime
          * `manga` - manga
          * `book` - book
        required: true
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 100
        description: Search text. For movie and series, also a full IMDb title URL
        required: true
      tags:
      - search
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultListResponse'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Too Many Requests
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Gateway
  /api/v3/tags:
    get:
      operationId: tags_list
      description: Tags from the user's reviews, most used first, then by name (ignoring
        case). Tags are grouped case-insensitively and returned in their most frequent
        spelling.
      summary: List a user's most-used tags
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum number of tags. Default 10; values above 50 are cut down
          to 50, and invalid values fall back to the default.
      - in: query
        name: username
        schema:
          type: string
        description: Whose tags to count. Defaults to the logged-in user; required
          when not logged in.
      tags:
      - tags
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
components:
  schemas:
    AnimeItem:
      type: object
      properties:
        id:
          type: string
        category:
          $ref: '#/components/schemas/AnimeItemCategoryEnum'
        title:
          type: string
        image_url:
          type: string
          format: uri
          nullable: true
        start_year:
          type: integer
          nullable: true
        end_year:
          type: integer
          nullable: true
          description: Null for a single year and for ongoing titles
        genres:
          type: array
          items:
            type: string
        creators:
          type: array
          items:
            type: string
          description: Crew, studios, developers or authors
        languages:
          type: array
          items:
            type: string
        description:
          type: string
          nullable: true
        provider_rating:
          type: number
          format: double
          nullable: true
          description: The source's rating, 0-10
        details:
          $ref: '#/components/schemas/MediaTypeDetails'
      required:
      - category
      - creators
      - description
      - details
      - end_year
      - genres
      - id
      - image_url
      - languages
      - provider_rating
      - start_year
      - title
    AnimeItemCategoryEnum:
      enum:
      - anime
      type: string
      description: '* `anime` - anime'
    BookDetails:
      type: object
      properties:
        pages:
          type: integer
          nullable: true
          description: Median page count of the editions
      required:
      - pages
    BookItem:
      type: object
      properties:
        id:
          type: string
        category:
          $ref: '#/components/schemas/BookItemCategoryEnum'
        title:
          type: string
        image_url:
          type: string
          format: uri
          nullable: true
        start_year:
          type: integer
          nullable: true
        end_year:
          type: integer
          nullable: true
          description: Null for a single year and for ongoing titles
        genres:
          type: array
          items:
            type: string
        creators:
          type: array
          items:
            type: string
          description: Crew, studios, developers or authors
        languages:
          type: array
          items:
            type: string
        description:
          type: string
          nullable: true
        provider_rating:
          type: number
          format: double
          nullable: true
          description: The source's rating, 0-10
        details:
          $ref: '#/components/schemas/BookDetails'
      required:
      - category
      - creators
      - description
      - details
      - end_year
      - genres
      - id
      - image_url
      - languages
      - provider_rating
      - start_year
      - title
    BookItemCategoryEnum:
      enum:
      - book
      type: string
      description: '* `book` - book'
    Category:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        subcategories:
          type: array
          items:
            $ref: '#/components/schemas/Subcategory'
        source:
          type: string
          description: Where item data comes from
        rating_label:
          type: string
          description: Name of the source's rating, e.g. IMDb
      required:
      - id
      - label
      - rating_label
      - source
      - subcategories
    CategoryFacet:
      type: object
      properties:
        id:
          type: string
        count:
          type: integer
      required:
      - count
      - id
    CategoryListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        meta:
          type: object
          additionalProperties: false
          description: Always empty for responses without pagination
      required:
      - data
      - meta
    DuplicateReviewProblem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        existing_review_id:
          type: integer
      required:
      - code
      - detail
      - existing_review_id
      - status
      - title
      - type
    FieldError:
      type: object
      properties:
        field:
          type: string
          nullable: true
        code:
          type: string
        message:
          type: string
      required:
      - code
      - field
      - message
    GameDetails:
      type: object
      properties:
        platforms:
          type: array
          items:
            type: string
      required:
      - platforms
    GameItem:
      type: object
      properties:
        id:
          type: string
        category:
          $ref: '#/components/schemas/GameItemCategoryEnum'
        title:
          type: string
        image_url:
          type: string
          format: uri
          nullable: true
        start_year:
          type: integer
          nullable: true
        end_year:
          type: integer
          nullable: true
          description: Null for a single year and for ongoing titles
        genres:
          type: array
          items:
            type: string
        creators:
          type: array
          items:
            type: string
          description: Crew, studios, developers or authors
        languages:
          type: array
          items:
            type: string
        description:
          type: string
          nullable: true
        provider_rating:
          type: number
          format: double
          nullable: true
          description: The source's rating, 0-10
        details:
          $ref: '#/components/schemas/GameDetails'
      required:
      - category
      - creators
      - description
      - details
      - end_year
      - genres
      - id
      - image_url
      - languages
      - provider_rating
      - start_year
      - title
    GameItemCategoryEnum:
      enum:
      - game
      type: string
      description: '* `game` - game'
    Item:
      oneOf:
      - $ref: '#/components/schemas/MovieItem'
      - $ref: '#/components/schemas/SeriesItem'
      - $ref: '#/components/schemas/GameItem'
      - $ref: '#/components/schemas/AnimeItem'
      - $ref: '#/components/schemas/MangaItem'
      - $ref: '#/components/schemas/BookItem'
      discriminator:
        propertyName: category
        mapping:
          movie: '#/components/schemas/MovieItem'
          series: '#/components/schemas/SeriesItem'
          game: '#/components/schemas/GameItem'
          anime: '#/components/schemas/AnimeItem'
          manga: '#/components/schemas/MangaItem'
          book: '#/components/schemas/BookItem'
    ItemResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Item'
        meta:
          type: object
          additionalProperties: false
          description: Always empty for responses without pagination
      required:
      - data
      - meta
    LanguageFacet:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
      required:
      - count
      - name
    MangaItem:
      type: object
      properties:
        id:
          type: string
        category:
          $ref: '#/components/schemas/MangaItemCategoryEnum'
        title:
          type: string
        image_url:
          type: string
          format: uri
          nullable: true
        start_year:
          type: integer
          nullable: true
        end_year:
          type: integer
          nullable: true
          description: Null for a single year and for ongoing titles
        genres:
          type: array
          items:
            type: string
        creators:
          type: array
          items:
            type: string
          description: Crew, studios, developers or authors
        languages:
          type: array
          items:
            type: string
        description:
          type: string
          nullable: true
        provider_rating:
          type: number
          format: double
          nullable: true
          description: The source's rating, 0-10
        details:
          $ref: '#/components/schemas/MediaTypeDetails'
      required:
      - category
      - creators
      - description
      - details
      - end_year
      - genres
      - id
      - image_url
      - languages
      - provider_rating
      - start_year
      - title
    MangaItemCategoryEnum:
      enum:
      - manga
      type: string
      description: '* `manga` - manga'
    MediaTypeDetails:
      type: object
      properties:
        media_type:
          type: string
          nullable: true
          description: OMDb type for movies and series, MAL media type for anime and
            manga
      required:
      - media_type
    MovieItem:
      type: object
      properties:
        id:
          type: string
        category:
          $ref: '#/components/schemas/MovieItemCategoryEnum'
        title:
          type: string
        image_url:
          type: string
          format: uri
          nullable: true
        start_year:
          type: integer
          nullable: true
        end_year:
          type: integer
          nullable: true
          description: Null for a single year and for ongoing titles
        genres:
          type: array
          items:
            type: string
        creators:
          type: array
          items:
            type: string
          description: Crew, studios, developers or authors
        languages:
          type: array
          items:
            type: string
        description:
          type: string
          nullable: true
        provider_rating:
          type: number
          format: double
          nullable: true
          description: The source's rating, 0-10
        details:
          $ref: '#/components/schemas/MediaTypeDetails'
      required:
      - category
      - creators
      - description
      - details
      - end_year
      - genres
      - id
      - image_url
      - languages
      - provider_rating
      - start_year
      - title
    MovieItemCategoryEnum:
      enum:
      - movie
      type: string
      description: '* `movie` - movie'
    MyReview:
      type: object
      properties:
        id:
          type: integer
        rating:
          type: number
          format: double
          maximum: 100
          minimum: -100
          exclusiveMaximum: true
          exclusiveMinimum: true
      required:
      - id
      - rating
    PaginatedMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - pagination
    Pagination:
      type: object
      properties:
        count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
      - count
      - limit
      - offset
    PatchedReviewUpdateRequest:
      type: object
      properties:
        rating:
          type: number
          format: double
          maximum: 10
          minimum: 0
        text:
          type: string
          nullable: true
          maxLength: 5000
        tags:
          type: array
          items:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9-]+$
            maxLength: 50
          maxItems: 10
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      required:
      - code
      - detail
      - status
      - title
      - type
    Review:
      type: object
      properties:
        id:
          type: integer
        user:
          $ref: '#/components/schemas/ReviewUser'
        item:
          $ref: '#/components/schemas/Item'
        rating:
          type: number
          format: double
          maximum: 100
          minimum: -100
          exclusiveMaximum: true
          exclusiveMinimum: true
        text:
          type: string
          nullable: true
          readOnly: true
        tags:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          nullable: true
          description: Null for reviews older than this field
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - id
      - item
      - rating
      - tags
      - text
      - updated_at
      - user
    ReviewCreateRequest:
      type: object
      properties:
        rating:
          type: number
          format: double
          maximum: 10
          minimum: 0
        text:
          type: string
          nullable: true
          maxLength: 5000
        tags:
          type: array
          items:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9-]+$
            maxLength: 50
          maxItems: 10
        item_id:
          type: string
          minLength: 1
      required:
      - item_id
      - rating
    ReviewFacets:
      type: object
      properties:
        total:
          type: integer
          description: Reviews matching every filter except the category ones
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryFacet'
          description: Every chip, in /categories order, zero counts included
        languages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageFacet'
          description: Most common first, then by name
      required:
      - categories
      - languages
      - total
    ReviewFacetsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ReviewFacets'
        meta:
          type: object
          additionalProperties: false
          description: Always empty for responses without pagination
      required:
      - data
      - meta
    ReviewPageResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        meta:
          $ref: '#/components/schemas/PaginatedMeta'
      required:
      - data
      - meta
    ReviewResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Review'
        meta:
          type: object
          additionalProperties: false
          description: Always empty for responses without pagination
      required:
      - data
      - meta
    ReviewUser:
      type: object
      properties:
        username:
          type: string
      required:
      - username
    SearchResult:
      type: object
      properties:
        id:
          type: string
        category:
          $ref: '#/components/schemas/SearchResultCategoryEnum'
        title:
          type: string
        image_url:
          type: string
          format: uri
          nullable: true
        start_year:
          type: integer
          nullable: true
        end_year:
          type: integer
          nullable: true
        genres:
          type: array
          items:
            type: string
          nullable: true
          description: Null when the provider's search doesn't give genres; [] when
            it gave none
        provider_rating:
          type: number
          format: double
          nullable: true
          description: The source's rating, 0-10. Null when the provider's search
            doesn't give it
        my_review:
          allOf:
          - $ref: '#/components/schemas/MyReview'
          nullable: true
          description: The logged-in user's review of this item, if any
      required:
      - category
      - end_year
      - genres
      - id
      - image_url
      - my_review
      - provider_rating
      - start_year
      - title
    SearchResultCategoryEnum:
      enum:
      - movie
      - series
      - game
      - anime
      - manga
      - book
      type: string
      description: |-
        * `movie` - movie
        * `series` - series
        * `game` - game
        * `anime` - anime
        * `manga` - manga
        * `book` - book
    SearchResultListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        meta:
          type: object
          additionalProperties: false
          description: Always empty for responses without pagination
      required:
      - data
      - meta
    SeriesItem:
      type: object
      properties:
        id:
          type: string
        category:
          $ref: '#/components/schemas/SeriesItemCategoryEnum'
        title:
          type: string
        image_url:
          type: string
          format: uri
          nullable: true
        start_year:
          type: integer
          nullable: true
        end_year:
          type: integer
          nullable: true
          description: Null for a single year and for ongoing titles
        genres:
          type: array
          items:
            type: string
        creators:
          type: array
          items:
            type: string
          description: Crew, studios, developers or authors
        languages:
          type: array
          items:
            type: string
        description:
          type: string
          nullable: true
        provider_rating:
          type: number
          format: double
          nullable: true
          description: The source's rating, 0-10
        details:
          $ref: '#/components/schemas/MediaTypeDetails'
      required:
      - category
      - creators
      - description
      - details
      - end_year
      - genres
      - id
      - image_url
      - languages
      - provider_rating
      - start_year
      - title
    SeriesItemCategoryEnum:
      enum:
      - series
      type: string
      description: '* `series` - series'
    Subcategory:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
      required:
      - id
      - label
    Tag:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
          description: How many times the tag is used in the reviews
      required:
      - count
      - name
    TagListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        meta:
          type: object
          additionalProperties: false
          description: Always empty for responses without pagination
      required:
      - data
      - meta
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: categories
