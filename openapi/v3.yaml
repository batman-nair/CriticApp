openapi: 3.0.3
info:
  title: CriticApp API v3
  version: '3.0'
  description: 'API for the CriticApp frontend. Successful responses are wrapped as
    {"data": ..., "meta": {...}}; errors are RFC 9457 problem+json with a stable `code`.
    See docs/API_V3.md.'
paths:
  /api/v3/categories:
    get:
      operationId: categories_list
      description: Every category with its filter subcategories, data source and rating
        label.
      summary: List categories
      tags:
      - categories
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
          description: ''
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
  /api/v3/tags:
    get:
      operationId: tags_list
      description: Tags from the user's reviews, most used first, then by name (ignoring
        case). Tags are grouped case-insensitively and returned in their most frequent
        spelling.
      summary: List a user's most-used tags
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum number of tags. Default 10; values above 50 are cut down
          to 50, and invalid values fall back to the default.
      - in: query
        name: username
        schema:
          type: string
        description: Whose tags to count. Defaults to the logged-in user; required
          when not logged in.
      tags:
      - tags
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        subcategories:
          type: array
          items:
            $ref: '#/components/schemas/Subcategory'
        source:
          type: string
          description: Where item data comes from
        rating_label:
          type: string
          description: Name of the source's rating, e.g. IMDb
      required:
      - id
      - label
      - rating_label
      - source
      - subcategories
    CategoryListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        meta:
          type: object
          additionalProperties: false
          description: Always empty for responses without pagination
      required:
      - data
      - meta
    FieldError:
      type: object
      properties:
        field:
          type: string
          nullable: true
        code:
          type: string
        message:
          type: string
      required:
      - code
      - field
      - message
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      required:
      - code
      - detail
      - status
      - title
      - type
    Subcategory:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
      required:
      - id
      - label
    Tag:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
          description: How many times the tag is used in the reviews
      required:
      - count
      - name
    TagListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        meta:
          type: object
          additionalProperties: false
          description: Always empty for responses without pagination
      required:
      - data
      - meta
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: categories
  description: Review categories and their data sources
- name: tags
  description: A user's most-used review tags
