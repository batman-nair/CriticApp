# Deny /metrics access at ingress level.
# Any request routed through this middleware receives 403 unless source IP is loopback.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: block-metrics
  namespace: criticapp
spec:
  ipWhiteList:
    sourceRange:
      - 127.0.0.1/32
      - ::1/128
---
# Redirect HTTP to HTTPS for the main Ingress. Django used to do this for
# every path (SECURE_SSL_REDIRECT), but / now reaches the frontend's nginx,
# which doesn't. Requests that are already HTTPS pass through unchanged.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: criticapp
spec:
  redirectScheme:
    scheme: https
    permanent: true
