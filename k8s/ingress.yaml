apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: criticapp-web-metrics
  namespace: criticapp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: criticapp-block-metrics@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  rules:
    - host: __APP_DOMAIN__
      http:
        paths:
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: criticapp-web
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: criticapp-web
  namespace: criticapp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: criticapp-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - __APP_DOMAIN__
      secretName: criticapp-web-tls
  rules:
    - host: __APP_DOMAIN__
      http:
        # Traefik gives each router a default priority equal to its rule's
        # length, so /api outranks /. The /metrics Ingress above has an explicit
        # priority of 100, which outranks both while the domain is under about
        # 60 characters. /health/ and /metrics/ have no public route to Django:
        # /health/ falls through to the frontend, which serves its own
        # not-found page with a 200, and /metrics stays blocked.
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: criticapp-web
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: criticapp-frontend
                port:
                  number: 80
