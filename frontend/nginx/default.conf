# The built app. /api never reaches this server in production: the ingress
# sends it to Django first.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # A types block here replaces the http-level one, so include the defaults
    # again. webmanifest is missing from them, and under nosniff it needs one.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed file names, so they never change. A missing one is a 404, never
    # index.html: that would be cached for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Every page URL gets the app, which shows its own 404 page.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
