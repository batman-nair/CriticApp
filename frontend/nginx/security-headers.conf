# Included in every location that sets its own headers: a location with any
# add_header drops the server-level ones.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The sha256 is the inline theme script in index.html. When that script
# changes, nginx-config.test.ts fails and prints the new value to paste here.
# style-src needs 'unsafe-inline': Radix injects <style> tags at runtime.
# img-src lists the poster hosts in review/providers/, plus RAWG for reviews
# saved before it was retired.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-qzkJ3qjIRl6gyaZSvpyMljUb0cImvNvQ9t8h0DNSBgM='; style-src 'self' 'unsafe-inline'; img-src 'self' https://m.media-amazon.com https://ia.media-amazon.com https://images-na.ssl-images-amazon.com https://images.igdb.com https://cdn.myanimelist.net https://covers.openlibrary.org https://media.rawg.io; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
